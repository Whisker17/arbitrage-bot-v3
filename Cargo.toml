[package]
name = "amms"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A library to interact with automated market makers across EVM chains."
readme = "README.md"
autoexamples = false
homepage = "https://github.com/darkforestry/amms-rs"
repository = "https://github.com/darkforestry/amms-rs"
keywords = ["ethereum", "amm", "mev"]
exclude = ["target/*", ".github/*", ".gitignore", "build.rs", "contracts/*"]


[dependencies]
# darkforest
# alloy
alloy = { version = "1.0.25", features = [
  "contract",
  "consensus",
  "network",
  "rpc",
  "rpc-types",
  "provider-ws",
  "rpc-types-eth",
  "signer-local",
] }
alloy-primitives = "0.6"
# tracing
eyre = "0.6"
tracing = "0.1"

# async
tokio = { version = "1.42", default-features = false }
futures = "0.3"
async-trait = "0.1"

# misc
arraydeque = "0.5"
thiserror = "1.0"
rayon = "1.11.0"
uniswap_v3_math = "0.6.2"
async-stream = "0.3.6"
serde = "1.0"
serde_json = "1.0"
petgraph = "0.6"
itertools = { version = "0.13", features = ["use_std"] }
csv = "1.3"
rug = "1.19"
libc = "0.2"
serde_json_canonicalizer = "0.3"
tempfile = "3"
# Cryptographically random 32-byte session nonces for the E2E capability
# layer (src/execution/e2e/provider_identity.rs).
rand = "0.9.2"


[features]
# Gates `signing::verify_with_paths`, the trust-path-injection seam used only
# by `tests/signing.rs` (a separate integration-test crate that can't reach
# `pub(crate)` items). Off by default so no downstream consumer of this
# library can bypass the code-constant `config::allowed_signers_path()` /
# `config::revoked_keys_path()` trust roots. Activated for test builds only,
# via the self dev-dependency below.
signing-test-util = []
# Gates the E2E capability layer's test-only construction seam
# (`execution::e2e::MapEnvSource`, `validate_e2e_startup_with_denylist`,
# `E2eBootstrapAuthority::establish_with_identity`) used only by
# `tests/e2e_capabilities.rs` and this module's own unit tests, both of
# which need to inject a synthetic env/denylist/provider-identity instead
# of depending on live process env or a live RPC round trip. Off by
# default so no downstream consumer can construct an authority without the
# real, live chain-id/genesis-hash validation `establish` performs.
e2e-test-util = []


[dev-dependencies]
amms = { path = ".", features = ["signing-test-util", "e2e-test-util"] }
tracing-subscriber = "0.3"
criterion = "0.7"
tokio = { version = "1.42", default-features = false, features = [
  "rt-multi-thread",
] }
alloy = { version = "1.0.25", features = ["rpc-client"] }
alloy-provider = { version = "1.0.25", features = ["throttle"] }
csv = "1.3"
serde_json = "1.0"
dotenv = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hex = "0.4"
alloy-json-rpc = "1.8.3"


[build-dependencies]
serde_json = "1.0"
rayon = "1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
debug = "full"


[[bench]]
name = "uniswap_v2"
harness = false

[[bench]]
name = "uniswap_v3"
