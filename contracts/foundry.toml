[profile.default]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["forge-std=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./" }]
# Pin exact solc; do not use workstation-specific absolute paths.
solc_version = "0.8.26"
auto_detect_solc = false
offline = true

[profile.default.optimizer_details]
yul = true
